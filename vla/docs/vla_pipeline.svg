<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 920" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">VLA Pipeline Architecture</text>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#888">DreamZero-aligned Precision: NVFP4 / FP8 / FP16</text>

  <!-- ============================================================ -->
  <!-- Input -->
  <!-- ============================================================ -->
  <rect x="250" y="65" width="400" height="40" rx="8" fill="#F0F0F0" stroke="#888" stroke-width="1.5"/>
  <text x="450" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">Image/Video Input: 6 cameras</text>

  <!-- Split arrows -->
  <line x1="350" y1="105" x2="200" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="105" x2="700" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="125" font-size="10" fill="#666">Target (3 cam)</text>
  <text x="600" y="125" font-size="10" fill="#666">Current (3 cam)</text>

  <!-- ============================================================ -->
  <!-- ①a VIT Target (Spatial only) -->
  <!-- ============================================================ -->
  <rect x="50" y="145" width="300" height="180" rx="10" fill="#EBF2FA" stroke="#2166AC" stroke-width="2"/>
  <text x="200" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#2166AC">①a ViT (Spatial)</text>

  <text x="70" y="195" font-size="11" fill="#555">B=3 cameras</text>
  <text x="70" y="212" font-size="11" fill="#555">S=225×4 = 900 tokens/cam</text>
  <text x="70" y="229" font-size="11" fill="#555">L=24 layers (pure Spatial)</text>
  <text x="70" y="246" font-size="11" fill="#555">d=1024</text>

  <!-- Precision tags -->
  <rect x="70" y="258" width="55" height="18" rx="4" fill="#FFD700"/>
  <text x="97" y="271" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">QKV FP8</text>
  <rect x="130" y="258" width="65" height="18" rx="4" fill="#7FFF00"/>
  <text x="162" y="271" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">FFN NVFP4</text>
  <rect x="200" y="258" width="55" height="18" rx="4" fill="#FFD700"/>
  <text x="227" y="271" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">FA FP8</text>

  <text x="200" y="300" text-anchor="middle" font-size="10" fill="#2166AC" font-weight="bold">1.870 TFLOPs</text>

  <!-- ============================================================ -->
  <!-- ①b VIT Current (Spatial + Temporal) -->
  <!-- ============================================================ -->
  <rect x="450" y="145" width="400" height="280" rx="10" fill="#EBF2FA" stroke="#2166AC" stroke-width="2"/>
  <text x="650" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#2166AC">①b ViT (Spatial + Temporal)</text>

  <!-- Spatial part -->
  <rect x="465" y="180" width="370" height="80" rx="6" fill="#D6E8F7" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="650" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#2166AC">Spatial Self-Attention</text>
  <text x="475" y="218" font-size="10" fill="#555">B=3, S=225×4=900, L=24, d=1024</text>
  <rect x="475" y="230" width="55" height="16" rx="3" fill="#FFD700"/>
  <text x="502" y="241" text-anchor="middle" font-size="8" font-weight="bold">QKV FP8</text>
  <rect x="535" y="230" width="60" height="16" rx="3" fill="#7FFF00"/>
  <text x="565" y="241" text-anchor="middle" font-size="8" font-weight="bold">FFN NVFP4</text>
  <rect x="600" y="230" width="50" height="16" rx="3" fill="#FFD700"/>
  <text x="625" y="241" text-anchor="middle" font-size="8" font-weight="bold">FA FP8</text>
  <text x="780" y="218" font-size="10" fill="#2166AC" font-weight="bold">1.870 TF</text>

  <!-- Arrow spatial → temporal -->
  <text x="650" y="275" text-anchor="middle" font-size="9" fill="#888">↓ 每4层插入1层 Temporal</text>

  <!-- Temporal part -->
  <rect x="465" y="285" width="370" height="100" rx="6" fill="#B0D4F1" stroke="#3572A5" stroke-width="1.5"/>
  <text x="650" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5276">Temporal Self-Attention (6 layers, no FFN)</text>
  <text x="475" y="325" font-size="10" fill="#555">S=18 (1 current + 17 history frames)</text>
  <text x="475" y="342" font-size="10" fill="#555">B=3×225×4 = 2700 patches (per-patch)</text>
  <text x="475" y="359" font-size="10" fill="#555">需读取 17帧 历史 KV cache</text>

  <rect x="475" y="365" width="55" height="16" rx="3" fill="#FFD700"/>
  <text x="502" y="376" text-anchor="middle" font-size="8" font-weight="bold">QKV FP8</text>
  <rect x="535" y="365" width="55" height="16" rx="3" fill="#FFD700"/>
  <text x="562" y="376" text-anchor="middle" font-size="8" font-weight="bold">Attn FP8</text>
  <text x="780" y="342" font-size="10" fill="#2166AC" font-weight="bold">2.468 TF</text>

  <!-- History KV cache -->
  <rect x="660" y="365" width="140" height="30" rx="5" fill="#FFF3CD" stroke="#D4A017" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="730" y="384" text-anchor="middle" font-size="9" font-weight="bold" fill="#856404">KV Cache: 17f×3cam×225</text>

  <text x="650" y="410" text-anchor="middle" font-size="10" fill="#2166AC" font-weight="bold">①b Total: 1.870 + 2.468 = 4.338 TFLOPs</text>

  <!-- ============================================================ -->
  <!-- Outputs merge -->
  <!-- ============================================================ -->
  <line x1="200" y1="325" x2="200" y2="455" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="370" font-size="9" fill="#666">merge 900→225</text>
  <text x="130" y="385" font-size="9" fill="#666">3×225 = 675 tok</text>

  <line x1="650" y1="425" x2="650" y2="455" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="680" y="445" font-size="9" fill="#666">675 tok</text>

  <!-- Concat box -->
  <rect x="150" y="460" width="600" height="35" rx="6" fill="#F8F8F8" stroke="#888" stroke-width="1.5"/>
  <text x="450" y="482" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">拼接: 675 (target) + 675 (current) + 200 (text) + 1 state = 1551 tokens</text>

  <!-- ============================================================ -->
  <!-- ② LLM Prefill -->
  <!-- ============================================================ -->
  <line x1="450" y1="495" x2="450" y2="520" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="150" y="525" width="600" height="130" rx="10" fill="#EBF7EB" stroke="#3D8B3D" stroke-width="2"/>
  <text x="450" y="550" text-anchor="middle" font-size="14" font-weight="bold" fill="#3D8B3D">② LLM Prefill (Qwen3-VL-4B)</text>

  <text x="170" y="575" font-size="11" fill="#555">B=1, S=1551, L=36, d=2560</text>
  <text x="170" y="595" font-size="11" fill="#555">GQA: 32Q / 8KV heads, head_dim=128</text>
  <text x="170" y="615" font-size="11" fill="#555">SwiGLU FFN: 3×9728</text>

  <rect x="500" y="565" width="55" height="18" rx="4" fill="#FFD700"/>
  <text x="527" y="578" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">QKV FP8</text>
  <rect x="560" y="565" width="65" height="18" rx="4" fill="#7FFF00"/>
  <text x="592" y="578" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">FFN NVFP4</text>
  <rect x="630" y="565" width="55" height="18" rx="4" fill="#FFD700"/>
  <text x="657" y="578" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">FA FP8</text>

  <text x="580" y="615" font-size="10" fill="#555">QKV=16% GEMM → FP8 | FFN=84% → NVFP4</text>
  <text x="450" y="645" text-anchor="middle" font-size="11" fill="#3D8B3D" font-weight="bold">12.680 TFLOPs</text>

  <!-- ============================================================ -->
  <!-- Arrow LLM → DiT -->
  <!-- ============================================================ -->
  <line x1="450" y1="655" x2="450" y2="690" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="678" font-size="9" fill="#666">输出 KV cache (36层 FA)</text>

  <!-- ============================================================ -->
  <!-- ③ DiT -->
  <!-- ============================================================ -->
  <rect x="150" y="695" width="600" height="135" rx="10" fill="#FAEBEB" stroke="#B52B27" stroke-width="2"/>
  <text x="450" y="720" text-anchor="middle" font-size="14" font-weight="bold" fill="#B52B27">③ DiT: Diffusion Action Transformer (×10 串行)</text>

  <text x="170" y="745" font-size="11" fill="#555">B=1, S=51 (50 actions + 1 state), L=18, d=1024</text>
  <text x="170" y="765" font-size="11" fill="#555">Self-Attn (51 tokens) + Cross-Attn (51×1551 LLM KV)</text>
  <text x="170" y="785" font-size="11" fill="#555">读取 LLM FA KV cache</text>

  <rect x="500" y="740" width="55" height="18" rx="4" fill="#FFD700"/>
  <text x="527" y="753" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">QKV FP8</text>
  <rect x="560" y="740" width="65" height="18" rx="4" fill="#7FFF00"/>
  <text x="592" y="753" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">FFN NVFP4</text>
  <rect x="630" y="740" width="55" height="18" rx="4" fill="#FFD700"/>
  <text x="657" y="753" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">FA FP8</text>

  <text x="580" y="785" font-size="10" fill="#555">QKV=87% GEMM → FP8 | FFN=13% → NVFP4</text>
  <text x="450" y="820" text-anchor="middle" font-size="11" fill="#B52B27" font-weight="bold">1.581 TFLOPs (×10 steps)</text>

  <!-- ============================================================ -->
  <!-- Output -->
  <!-- ============================================================ -->
  <line x1="450" y1="830" x2="450" y2="860" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="300" y="865" width="300" height="35" rx="8" fill="#F0F0F0" stroke="#888" stroke-width="1.5"/>
  <text x="450" y="888" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">Action Output: 50 chunks × 62D</text>

  <!-- ============================================================ -->
  <!-- Precision Legend (bottom-right) -->
  <!-- ============================================================ -->
  <rect x="15" y="470" width="120" height="80" rx="6" fill="#fff" stroke="#CCC" stroke-width="1"/>
  <text x="25" y="488" font-size="9" font-weight="bold" fill="#555">Precision</text>
  <rect x="25" y="495" width="12" height="12" rx="2" fill="#FFD700"/>
  <text x="42" y="505" font-size="9" fill="#444">FP8 (E4M3)</text>
  <rect x="25" y="512" width="12" height="12" rx="2" fill="#7FFF00"/>
  <text x="42" y="522" font-size="9" fill="#444">NVFP4 (E2M1)</text>
  <rect x="25" y="529" width="12" height="12" rx="2" fill="#CCC"/>
  <text x="42" y="539" font-size="9" fill="#444">FP16</text>
</svg>
