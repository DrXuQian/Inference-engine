<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2B2B2B">Brain Pipeline</text>
  <text x="460" y="56" text-anchor="middle" font-size="12" fill="#777">DINO + CLIP visual encoding with Qwen3-VL-30B-A3B reasoning</text>

  <!-- Inputs -->
  <rect x="40" y="105" width="190" height="70" rx="8" fill="#F6F6F6" stroke="#888" stroke-width="1.5"/>
  <text x="135" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">Text Input</text>
  <text x="135" y="154" text-anchor="middle" font-size="12" fill="#555">200 tokens</text>

  <rect x="40" y="240" width="190" height="95" rx="8" fill="#F6F6F6" stroke="#888" stroke-width="1.5"/>
  <text x="135" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">Image Input</text>
  <text x="135" y="288" text-anchor="middle" font-size="12" fill="#555">4 images</text>
  <text x="135" y="310" text-anchor="middle" font-size="11" fill="#777">camera/frame set</text>

  <!-- Image split -->
  <line x1="230" y1="272" x2="300" y2="210" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="305" x2="300" y2="355" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="232" font-size="10" fill="#666">4 images</text>
  <text x="254" y="342" font-size="10" fill="#666">1 selected image</text>

  <!-- Text path -->
  <line x1="230" y1="140" x2="520" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="348" y="128" font-size="10" fill="#666">prompt tokens</text>

  <!-- CLIP branch -->
  <rect x="300" y="160" width="180" height="105" rx="10" fill="#EBF2FA" stroke="#2166AC" stroke-width="2"/>
  <text x="390" y="188" text-anchor="middle" font-size="15" font-weight="bold" fill="#2166AC">CLIP</text>
  <text x="390" y="212" text-anchor="middle" font-size="12" fill="#555">vision encoder</text>
  <text x="390" y="235" text-anchor="middle" font-size="11" fill="#555">processes all 4 images</text>
  <rect x="320" y="248" width="62" height="16" rx="3" fill="#FFD700"/>
  <text x="351" y="260" text-anchor="middle" font-size="8" font-weight="bold" fill="#333">visual tokens</text>
  <rect x="398" y="248" width="62" height="16" rx="3" fill="#D6E8F7"/>
  <text x="429" y="260" text-anchor="middle" font-size="8" font-weight="bold" fill="#333">global emb</text>

  <!-- DINO branch -->
  <rect x="300" y="315" width="180" height="105" rx="10" fill="#FFF3CD" stroke="#D4A017" stroke-width="2"/>
  <text x="390" y="343" text-anchor="middle" font-size="15" font-weight="bold" fill="#856404">DINO</text>
  <text x="390" y="367" text-anchor="middle" font-size="12" fill="#555">single-image encoder</text>
  <text x="390" y="390" text-anchor="middle" font-size="11" fill="#555">uses 1 of 4 images</text>
  <rect x="332" y="403" width="116" height="16" rx="3" fill="#FFE8A3"/>
  <text x="390" y="415" text-anchor="middle" font-size="8" font-weight="bold" fill="#333">dense image features</text>

  <!-- Brain model -->
  <rect x="520" y="105" width="350" height="275" rx="12" fill="#EBF7EB" stroke="#3D8B3D" stroke-width="2.2"/>
  <text x="695" y="135" text-anchor="middle" font-size="16" font-weight="bold" fill="#3D8B3D">Qwen3-VL-30B-A3B</text>
  <text x="695" y="158" text-anchor="middle" font-size="12" fill="#555">Brain / VLM reasoning module</text>

  <rect x="545" y="185" width="300" height="42" rx="6" fill="#F8FFF8" stroke="#A8CFA8" stroke-width="1"/>
  <text x="562" y="211" font-size="12" fill="#555">Text context: 200 tokens</text>

  <rect x="545" y="238" width="300" height="42" rx="6" fill="#F8FFF8" stroke="#A8CFA8" stroke-width="1"/>
  <text x="562" y="264" font-size="12" fill="#555">CLIP context: 4-image visual embeddings</text>

  <rect x="545" y="291" width="300" height="42" rx="6" fill="#F8FFF8" stroke="#A8CFA8" stroke-width="1"/>
  <text x="562" y="317" font-size="12" fill="#555">DINO context: single-image dense features</text>

  <text x="695" y="356" text-anchor="middle" font-size="11" font-weight="bold" fill="#3D8B3D">MoE reasoning, scene understanding, task planning</text>

  <!-- Branch to brain arrows -->
  <line x1="480" y1="212" x2="520" y2="258" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="368" x2="520" y2="312" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output -->
  <line x1="695" y1="380" x2="695" y2="430" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="515" y="435" width="360" height="75" rx="8" fill="#FAEBEB" stroke="#B52B27" stroke-width="1.8"/>
  <text x="695" y="463" text-anchor="middle" font-size="14" font-weight="bold" fill="#B52B27">Brain Output</text>
  <text x="695" y="487" text-anchor="middle" font-size="12" fill="#555">reasoning tokens / KV cache / high-level plan</text>
</svg>
